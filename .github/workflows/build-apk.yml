name: APK derle

# Bu iş akışı, projeyi GitHub'a yükledikten sonra APK'yı senin yerine derler.
# Bilgisayarına hiçbir şey kurman gerekmez.
#
# Nasıl çalışır:
#  1. Projeyi GitHub'a yükle (public veya private fark etmez).
#  2. Depodaki "Actions" sekmesine gir.
#  3. Soldan "APK derle" > sağdan "Run workflow" de (veya herhangi bir değişiklik gönder).
#  4. İş bitince sayfanın altındaki "Artifacts" bölümünden
#     "AskTakvimi-APK" dosyasını indir, zip'ten çıkar ve telefona kur.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Testleri çalıştır ve APK üret
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android SDK paketlerini hazırla
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager bulunamadı"; exit 1
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: gradlew'e çalışma izni ver
        run: chmod +x ./gradlew

      - name: Birim testleri çalıştır
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Test raporunu yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-raporu
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: APK derle
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: AskTakvimi-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # APK'yı depodaki dist/ klasörüne de koyar; böylece Actions'a girmeden
      # doğrudan depo sayfasından indirilebilir.
      - name: APK'yı depoya işle
        if: github.ref == 'refs/heads/main'
        run: |
          set -e
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AskTakvimi.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/AskTakvimi.apk
          if git diff --cached --quiet; then
            echo "APK değişmemiş, işlenecek bir şey yok."
          else
            git commit -m "APK güncellendi [skip ci]"
            git push
          fi

      # Ayrıca indirilebilir bir sürüm (Release) oluşturur.
      - name: Sürüm olarak yayınla
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cp app/build/outputs/apk/debug/app-debug.apk AskTakvimi.apk
          if gh release view apk-son >/dev/null 2>&1; then
            gh release upload apk-son AskTakvimi.apk --clobber
          else
            gh release create apk-son AskTakvimi.apk \
              --title "Aşk Takvimi — son APK" \
              --notes "Telefona kurulabilen güncel APK. İndir, dokun, yükle."
          fi
